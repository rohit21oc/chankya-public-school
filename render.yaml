services:
  # ---------------------------------------------------------------------------
  # Frontend React SPA Deployment on Render (Static Site)
  # Fixes Render 404 "Not Found" on browser refresh (F5), direct entry, and bookmarks
  # Service name matching live domain: https://residentialpdsschool.in
  # ---------------------------------------------------------------------------
  - type: web
    name: residentialpdspublicschool
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # Central School ERP Backend API (Node.js Web Service)
  # Live domain: https://residentialpdsschool.onrender.com
  # ---------------------------------------------------------------------------
  - type: web
    name: residentialpdsschool
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
